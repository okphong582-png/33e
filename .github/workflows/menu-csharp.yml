name: Build CSharp IFix Menu
on:
  workflow_dispatch:
  push:
    paths:
      - 'menu/**'
      - '.github/workflows/menu-csharp.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile CSharp builder
        shell: pwsh
        run: |
          $compilerPath = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compilerPath /nologo /warnaserror+ /optimize+ /out:menu\MenuBuilder.exe .\menu\Program.cs .\menu\Bindings.cs .\menu\GameCode.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Emit IFix bytes
        shell: pwsh
        run: |
          & ./menu/MenuBuilder.exe menu/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check binary and menu control flow
        run: node menu/test-menu.cjs
      - name: Checkout pinned Tencent InjectFix interpreter
        uses: actions/checkout@v4
        with:
          repository: Tencent/InjectFix
          ref: 5ba42eb8f63fe37134a3c78690f97d8425e13588
          path: .ifix-runtime
          persist-credentials: false
      - name: Execute bytes in upstream interpreter
        shell: pwsh
        run: |
          node menu/prepare-runtime-test.cjs .ifix-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerPath = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compilerPath /nologo /unsafe /warnaserror+ /nowarn:0169 /optimize+ /out:menu\runtime-test\RuntimeTest.exe .\menu\runtime-test\*.cs .\menu\RuntimeTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./menu/runtime-test/RuntimeTest.exe menu/dist/Assembly-CSharp-patch.bytes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Mizze CSharp into IFix
        run: node menu/mizze/build.cjs .ifix-runtime
      - name: Package Mizze for TH iOS
        run: node menu/mizze/package.cjs
      - name: Execute Mizze bytes and verify bindings
        run: node menu/mizze/test.cjs
      - name: Upload Mizze menu artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-Assembly-CSharp-patch
          path: |
            menu/mizze/dist/Assembly-CSharp-patch.bytes
            menu/mizze/dist/SHA256SUMS.txt
            menu/mizze/dist/manifest.json
            menu/mizze/dist/methods.tsv
            menu/mizze/dist/*.svg
            menu/mizze/README.md
            menu/mizze/localConfig.json
          if-no-files-found: error
      - name: Build Mizze from old-source core
        run: node menu/mizze-oldbase/build.cjs .ifix-runtime
      - name: Package old-source four-hook menu
        run: node menu/mizze-oldbase/package.cjs
      - name: Verify old-source bytes and core
        run: node menu/mizze-oldbase/test.cjs
      - name: Upload old-source menu
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-OldSource-Menu
          path: |
            menu/mizze-oldbase/dist/Assembly-CSharp-patch.bytes
            menu/mizze-oldbase/dist/SHA256SUMS.txt
            menu/mizze-oldbase/dist/manifest.json
            menu/mizze-oldbase/dist/methods.tsv
            menu/mizze-oldbase/dist/*.svg
            menu/mizze-oldbase/README.md
            menu/mizze-oldbase/localConfig.json
          if-no-files-found: error
      - name: Upload ESP Box fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assembly-CSharp-patch-menu
          path: |
            menu/dist/Assembly-CSharp-patch.bytes
            menu/dist/SHA256SUMS.txt
            menu/README.md
          if-no-files-found: error
