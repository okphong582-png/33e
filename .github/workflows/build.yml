name: Build Mizze Dylib and TIPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Optional URL to download decrypted IPA to inject'
        required: false
        default: ''

jobs:
  network-responsiveness:
    name: Test main-loop responsiveness
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Signed executable page mapping without unsigned code or debug flags
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror tests/silent_aim_mapping_test.cpp tests/silent_aim_mapping_fixture.S -o /tmp/silent-aim-mapping-test
          codesign --force --sign - --options runtime /tmp/silent-aim-mapping-test
          /tmp/silent-aim-mapping-test
      - name: Native Mach-O protection sections and safe data round trips
        run: |
          clang++ -std=c++17 -Os -pthread -fvisibility=hidden -Wno-unused-function -fsanitize=address,undefined -I. tests/obfuscation_test.cpp tests/obfuscation_seed_fixture.cpp -o /tmp/obfuscation-test
          /tmp/obfuscation-test
          clang++ -std=c++17 -Os -pthread -fvisibility=hidden -Wno-unused-function -fsanitize=thread -I. tests/obfuscation_test.cpp tests/obfuscation_seed_fixture.cpp -o /tmp/obfuscation-thread-test
          /tmp/obfuscation-thread-test
      - name: Deferred protection initialization and concurrent configuration decoding
        run: |
          clang++ -std=c++17 -Os -fobjc-arc -fvisibility=hidden -DMIZZE_INJECTED=1 -Wno-unused-function -I. -Itests/stubs -framework Foundation -framework CoreGraphics tests/injected_protection_test.mm tests/injected_protection_host.mm sources/InjectedProtection.mm -o /tmp/injected-protection-test
          /tmp/injected-protection-test
      - name: Injected startup tolerates missing and legacy Unity scenes
        run: |
          clang++ -std=c++17 -fobjc-arc -Itests/stubs -framework Foundation -framework CoreGraphics tests/injected_window_test.mm -o /tmp/injected-window-test
          /tmp/injected-window-test
          clang++ -std=c++17 -fobjc-arc -framework Foundation tests/os_version_test.mm sources/fix_version.mm -o /tmp/os-version-test
          /tmp/os-version-test
      - name: Two loaded dylib copies must share one overlay owner
        run: |
          clang++ -std=c++17 -fobjc-arc -dynamiclib -framework Foundation tests/overlay_ownership_fixture.mm -o /tmp/overlay-first.dylib
          clang++ -std=c++17 -fobjc-arc -dynamiclib -framework Foundation tests/overlay_ownership_fixture.mm -o /tmp/overlay-second.dylib
          clang++ -std=c++17 -fobjc-arc -framework Foundation tests/overlay_ownership_test.mm -o /tmp/overlay-ownership-test
          /tmp/overlay-ownership-test /tmp/overlay-first.dylib /tmp/overlay-second.dylib
      - name: Delayed and failed offset responses must not block the UI
        run: |
          clang++ -std=c++17 -fobjc-arc -I. -framework Foundation tests/offset_responsiveness_test.mm esp/Core/_0xNW2872_.mm -o /tmp/offset-responsiveness-test
          /tmp/offset-responsiveness-test
      - name: Saved keys require fresh online verification
        run: |
          clang++ -std=c++17 -fobjc-arc -Wno-deprecated-declarations -I. -framework Foundation tests/license_restore_test.mm sources/LicenseSession.mm -o /tmp/license-restore-test
          /tmp/license-restore-test
          clang++ -std=c++17 -fobjc-arc -DMIZZE_INJECTED=1 -Wno-deprecated-declarations -Wno-unused-function -I. -Itests/stubs -framework Foundation -framework CoreGraphics tests/license_restore_test.mm tests/injected_protection_host.mm sources/LicenseSession.mm sources/InjectedProtection.mm -o /tmp/license-injected-test
          /tmp/license-injected-test
  build:
    name: Build Mizze ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [dylib, tipa]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bounded VM, corruption checks and concurrent protection initialization
        run: |
          for seed in 1 0x4D495A5A4533; do
            g++ -std=c++17 -Os -pthread -Wall -Wextra -Werror -Wno-unused-function -DOBFUSCATION_BUILD_SEED=$seed -fsanitize=address,undefined -I. tests/obfuscation_test.cpp tests/obfuscation_seed_fixture.cpp -o /tmp/obfuscation-test
            /tmp/obfuscation-test
          done

      - name: Test license lease and retry policy
        run: |
          python3 tests/ipa_replacement_test.py
          python3 tests/ipa_injection_test.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/license_session_policy_test.cpp -o /tmp/license-session-policy-test
          /tmp/license-session-policy-test

      - name: Test aim selection
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -Wno-error=attributes -Wno-error=parentheses -I. tests/overlay_health_test.cpp -o /tmp/overlay-health-test
          /tmp/overlay-health-test
          g++ -std=c++17 -Wall -Wextra -Werror tests/silent_aim_policy_test.cpp -o /tmp/silent-aim-policy-test
          /tmp/silent-aim-policy-test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/silent_aim_selection_test.cpp -o /tmp/silent-aim-selection-test
          /tmp/silent-aim-selection-test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/silent_aim_external_test.cpp -o /tmp/silent-aim-external-test
          /tmp/silent-aim-external-test
          python3 -m pip install unicorn==2.1.4
          clang --target=aarch64-linux-gnu -c esp/Core/AutoFireRemote.S -o /tmp/auto-fire.o
          clang --target=aarch64-linux-gnu -c esp/Core/SilentAimRemote.S -o /tmp/silent-remote.o
          python3 tests/auto_fire_remote_test.py /tmp/auto-fire.o /tmp/silent-remote.o
          python3 tests/silent_aim_remote_test.py /tmp/silent-remote.o
          clang --target=arm64-apple-ios16.5 -c esp/Core/AutoFireRemote.S -o /tmp/auto-fire-ios.o
          clang --target=arm64-apple-ios16.5 -c esp/Core/SilentAimRemote.S -o /tmp/silent-remote-ios.o
          python3 tests/auto_fire_remote_test.py /tmp/auto-fire-ios.o /tmp/silent-remote-ios.o
          python3 tests/silent_aim_remote_test.py /tmp/silent-remote-ios.o
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/silent_aim_direction_test.cpp -o /tmp/silent-aim-direction-test
          /tmp/silent-aim-direction-test
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -Wno-error=attributes -Wno-error=parentheses -I. -fsanitize=address,undefined tests/game_pri_test.cpp -o /tmp/game-pri-test
          /tmp/game-pri-test
          g++ -std=c++17 -Wall -Wextra -Werror tests/aim_selection_test.cpp -o /tmp/aim-selection-test
          /tmp/aim-selection-test
          g++ -std=c++17 -I. tests/aim_point_test.cpp -o /tmp/aim-point-test
          /tmp/aim-point-test

      - name: Test overlay clipping
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/overlay_geometry_test.cpp -o /tmp/overlay-geometry-test
          /tmp/overlay-geometry-test

      - name: Test reversible weapon settings and stale owner guards
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/weapon_features_test.cpp -o /tmp/weapon-features-test
          /tmp/weapon-features-test

      - name: Test nonblocking offset requests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/async_offset_state_test.cpp -o /tmp/async-offset-test
          /tmp/async-offset-test

      - name: Setup Theos & Toolchain
        uses: Randomblock1/theos-action@v1

      - name: Test bounded skeleton reads and cached offsets
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/transform_traversal_test.cpp -o /tmp/transform-traversal-test
          /tmp/transform-traversal-test
          g++ -std=c++17 -I. tests/offset_constants_test.cpp -o /tmp/offset-constants-test
          /tmp/offset-constants-test

      - name: Build selected package
        run: |
          make clean package BUILD_KIND=${{ matrix.kind }} FINALPACKAGE=1 FOR_RELEASE=1

      - name: Injected dylib must have no prelaunch touch callbacks or private HUD dependencies
        if: matrix.kind == 'dylib'
        run: python3 tools/verify_injected_dylib.py packages/libsubsystem.dylib

      - name: Inject Dylib into IPA (If Available)
        if: matrix.kind == 'dylib'
        env:
          IPA_URL: ${{ github.event.inputs.ipa_url }}
        run: |
          if [ -n "$IPA_URL" ]; then
            echo "[*] Downloading IPA from URL..."
            curl --fail -L "$IPA_URL" -o /tmp/input_game.ipa
            python3 tools/inject_dylib.py /tmp/input_game.ipa packages/libsubsystem.dylib packages/com.dts.freefireth-1.132.1-Injected.ipa
          elif [ -f "com.dts.freefireth-1.132.1-Decrypted.ipa" ]; then
            python3 tools/inject_dylib.py com.dts.freefireth-1.132.1-Decrypted.ipa packages/libsubsystem.dylib packages/com.dts.freefireth-1.132.1-Injected.ipa
          else
            echo "[!] No IPA file provided in repository or workflow dispatch inputs; dylib output available in packages/"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-${{ matrix.kind }}
          path: |
            packages/*.dylib
            packages/*.ipa
            packages/*.tipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.dylib
            packages/*.ipa
            packages/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
