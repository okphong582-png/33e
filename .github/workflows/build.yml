name: Mizze Start Uninstall Glass TH
on:
  push:
    branches: [codex/mizze-start-uninstall-glass-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q Mizze-Start-Uninstall-Source.zip -d app
      - name: Install signing helper
        run: brew install ldid
      - name: Build app and test commands
        working-directory: app
        run: bash devkit/build-mizze.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-Start-Uninstall-TH
          if-no-files-found: error
          path: |
            app/build/Mizze-Start-Uninstall.tipa
            app/build/Mizze-Start-Uninstall.ipa
            app/build/Mizze-Start-Uninstall.sha256
            app/build/app-verification.json
            app/build/app-state-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-Build-Diagnostics
          path: app/build/*.log
