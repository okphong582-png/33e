name: Build TIPA Automatically

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build .tipa package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test license lease and retry policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/license_session_policy_test.cpp -o /tmp/license-session-policy-test
          /tmp/license-session-policy-test

      - name: Test aim selection
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/aim_selection_test.cpp -o /tmp/aim-selection-test
          /tmp/aim-selection-test

      - name: Test overlay clipping
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/overlay_geometry_test.cpp -o /tmp/overlay-geometry-test
          /tmp/overlay-geometry-test

      - name: Setup Theos & Toolchain
        uses: Randomblock1/theos-action@v1

      - name: Build TIPA Package
        run: |
          make clean package FINALPACKAGE=1 FOR_RELEASE=1

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugchi-TIPA
          path: packages/*.tipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
