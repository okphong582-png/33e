name: Build TIPA Automatically

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  network-responsiveness:
    name: Test main-loop responsiveness
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delayed and failed offset responses must not block the UI
        run: |
          clang++ -std=c++17 -fobjc-arc -I. -framework Foundation tests/offset_responsiveness_test.mm esp/Core/_0xNW2872_.mm -o /tmp/offset-responsiveness-test
          /tmp/offset-responsiveness-test
      - name: Saved keys require fresh online verification
        run: |
          clang++ -std=c++17 -fobjc-arc -Wno-deprecated-declarations -I. -framework Foundation tests/license_restore_test.mm sources/LicenseSession.mm -o /tmp/license-restore-test
          /tmp/license-restore-test
  build:
    name: Build .tipa package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test license lease and retry policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/license_session_policy_test.cpp -o /tmp/license-session-policy-test
          /tmp/license-session-policy-test

      - name: Test aim selection
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/aim_selection_test.cpp -o /tmp/aim-selection-test
          /tmp/aim-selection-test

      - name: Test overlay clipping
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/overlay_geometry_test.cpp -o /tmp/overlay-geometry-test
          /tmp/overlay-geometry-test

      - name: Test nonblocking offset requests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/async_offset_state_test.cpp -o /tmp/async-offset-test
          /tmp/async-offset-test

      - name: Setup Theos & Toolchain
        uses: Randomblock1/theos-action@v1

      - name: Test bounded skeleton reads and cached offsets
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/transform_traversal_test.cpp -o /tmp/transform-traversal-test
          /tmp/transform-traversal-test
          g++ -std=c++17 -I. tests/offset_constants_test.cpp -o /tmp/offset-constants-test
          /tmp/offset-constants-test

      - name: Build TIPA Package
        run: |
          make clean package FINALPACKAGE=1 FOR_RELEASE=1

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugchi-TIPA
          path: packages/*.tipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
