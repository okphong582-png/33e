name: Build TIPA Automatically

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build .tipa package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lldb lld llvm make zip unzip curl git libssl-dev pkg-config

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Setup iOS SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build TIPA Package
        run: |
          export THEOS=$HOME/theos
          make clean package FINALPACKAGE=1 FOR_RELEASE=1

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugchi-TIPA
          path: packages/*.tipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
