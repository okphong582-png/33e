name: Build Old Source Menu
on:
  workflow_dispatch:
  push:
    paths:
      - 'menu/mizze-original/**'
      - '.github/workflows/mizze-original.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned Tencent InjectFix
        uses: actions/checkout@v4
        with:
          repository: Tencent/InjectFix
          ref: 5ba42eb8f63fe37134a3c78690f97d8425e13588
          path: .ifix-runtime
          persist-credentials: false
      - name: Prepare interpreter
        run: node menu/prepare-runtime-test.cjs .ifix-runtime
      - name: Verify reviewed old-source snapshot
        run: node menu/verify-mizze-original.cjs
      - name: Compile edited old source
        run: node menu/mizze-original/build.cjs .ifix-runtime
      - name: Package using original serializer
        run: node menu/mizze-original/package.cjs
      - name: Run final bytecode tests
        run: node menu/mizze-original/test.cjs
      - name: Measure bytecode allocations
        run: node menu/mizze-original/test.cjs profile
      - name: Verify build does not modify source
        run: node menu/verify-mizze-original.cjs
      - name: Upload old-source ESP/RAM build
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-OldSource-ESP-RAM
          path: |
            menu/mizze-original/dist/Assembly-CSharp-patch.bytes
            menu/mizze-original/dist/SHA256SUMS.txt
            menu/mizze-original/dist/manifest.json
            menu/mizze-original/dist/methods.tsv
            menu/mizze-original/dist/*.svg
            menu/mizze-original/dist/allocation-profile.json
            menu/mizze-original/memory-allocation-evidence.json
            menu/mizze-original/README.md
            menu/mizze-original-hashes.json
          if-no-files-found: error
