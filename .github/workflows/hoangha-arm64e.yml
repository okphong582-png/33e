name: Hoangha arm64e

on:
  push:
    branches: ['codex/hoangha-arm64e-20261108212650', 'codex/hoangha-esp-box-20261109']
    paths:
      - 'apps/hoangha-lara/**'
      - '.github/workflows/hoangha-arm64e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/hoangha-lara
    steps:
      - uses: actions/checkout@v4
      - name: Test FF profile and screen geometry
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Standalone/tests/freefire_reader_test.cpp -o /tmp/hoangha-ff-test
          /tmp/hoangha-ff-test
          c++ -std=c++17 -Wall -Wextra -Werror Standalone/tests/geometry_test.cpp -o /tmp/hoangha-geometry-test
          /tmp/hoangha-geometry-test
          c++ -std=c++17 -Wall -Wextra -Werror Standalone/tests/game_schedule_test.cpp -o /tmp/hoangha-schedule-test
          /tmp/hoangha-schedule-test
          c++ -std=c++17 -Wall -Wextra -Werror Standalone/tests/aim_math_test.cpp -o /tmp/hoangha-aim-math-test
          /tmp/hoangha-aim-math-test
      - name: Build with Apple arm64e ABI
        run: bash Standalone/build-macos.sh
      - name: Upload IPA and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoangha-arm64e
          path: |
            apps/hoangha-lara/exports/Hoangha-arm64e-*/Hoangha-Lara-arm64e.ipa
            apps/hoangha-lara/exports/Hoangha-arm64e-*/architecture.json
            apps/hoangha-lara/exports/Hoangha-arm64e-*/build.log
