<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tạo license key</title>
  <style>
    :root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0e1015;color:#e9edf5}
    body{max-width:720px;margin:32px auto;padding:0 18px}
    main{background:#171a22;border:1px solid #343a48;border-radius:18px;padding:24px;box-shadow:0 14px 45px #0008}
    h1{font-size:22px;margin:0 0 6px}p{color:#aab2c2;line-height:1.45}
    label{display:block;margin:18px 0 7px;color:#cbd2df}input,button{font:inherit;border-radius:10px}
    input{width:100%;box-sizing:border-box;background:#0e1015;color:#fff;border:1px solid #3a4252;padding:11px}
    .quick{display:flex;gap:8px}.quick input.key{flex:1}.quick input.days{flex:0 0 92px}.quick button{margin:0}
    button{border:0;background:#3277d8;color:#fff;padding:11px 15px;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}.warning{color:#ffbd72;font-size:13px}
    #status{min-height:24px;margin-top:18px;color:#8fe3a0}
  </style>
</head>
<body>
<main>
  <h1>Tạo license key online</h1>
  <p>Nhập key và số ngày, bấm Tạo. Bản ghi sẽ được đồng bộ trực tiếp vào Realtime Database.</p>
  <label for="keyInput">Key <span class="warning">(để trống để tự sinh)</span></label>
  <div class="quick">
    <input id="keyInput" class="key" autocomplete="off" placeholder="HH-...">
    <input id="days" class="days" type="number" min="1" max="3650" value="30" title="Số ngày dùng">
    <button id="generate">Tạo</button>
  </div>
  <p id="status" role="status"></p>
</main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmP7OU9mhsQruZ2BWXLzhK3HlWkKH-ftI",
  databaseURL: "https://appchatai-313e-default-rtdb.firebaseio.com"
};
const $ = id => document.getElementById(id);
function hex(bytes){return [...bytes].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function digest(text){
  const bytes = new TextEncoder().encode(text);
  return hex(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)));
}
function randomKey(){
  const bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
  return "HH-" + hex(bytes).toUpperCase();
}
function setStatus(text, error=false){ $('status').textContent=text; $('status').style.color=error ? "#ff8d8d" : "#8fe3a0"; }
$("generate").onclick = async () => {
  const typed = $("keyInput").value.trim().toUpperCase();
  const key = typed || randomKey();
  const days = Number($("days").value);
  if(key.length < 8 || key.length > 128){setStatus("Key phải dài từ 8 đến 128 ký tự.", true);return}
  if(!Number.isFinite(days) || days < 1 || days > 3650){setStatus("Thời lượng phải từ 1 đến 3650 ngày.", true);return}
  $("generate").disabled = true; setStatus("Đang đồng bộ…");
  try {
    const hash = await digest(key);
    const url = `${firebaseConfig.databaseURL}/licenses/${hash}.json`;
    const response = await fetch(url, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({enabled:true, expiresAt:Date.now() + Math.round(days * 86400000)})
    });
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    $("keyInput").value = key;
    setStatus(`Đã tạo và đồng bộ key: ${key}`);
  } catch(error) {
    setStatus("Không ghi được vào Realtime Database. Hãy kiểm tra Rules và kết nối mạng.", true);
  } finally { $("generate").disabled = false; }
};
</script>
</body>
</html>
