    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      button {
        width: 45px;
        height: 45px;
        padding: 0;
        border: 1px solid rgba(0,0,0,.12);
        border-radius: 50%;
        background: white;
        display: grid;
        place-items: center;
        touch-action: manipulation;
      }
      img {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        pointer-events: none;
      }
    </style>

    <script>
      var overlayGame = "%%OVERLAY_GAME%%";
      var socketURL = "ws://127.0.0.1:%%OVERLAY_WS_PORT%%";
      var socket = null;
      var reconnectTimer = 0;
      var pendingToggle = false;
      var fab = document.getElementById("fab");

      function send(message) {
        message.game = overlayGame;
        if (!socket || socket.readyState !== WebSocket.OPEN) return false;
        try {
          socket.send(JSON.stringify(message));
          return true;
        } catch (error) {
          return false;
        }
      }

      function flushPendingToggle() {
        if (!pendingToggle) return;
        if (send({ type: "toggleMenu" })) pendingToggle = false;
      }

      function connect() {
        try {
          socket = new WebSocket(socketURL);
        } catch (error) {
          scheduleReconnect();
          return;
        }
        socket.onopen = function () {
          send({ type: "hello", role: "fab" });
          flushPendingToggle();
        };
        socket.onclose = function () {
          socket = null;
          scheduleReconnect();
        };
        socket.onerror = function () {
          try {
            socket.close();
          } catch (error) {}
        };
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = 0;
          connect();
        }, 500);
      }

      fab.addEventListener("click", function (event) {
        event.preventDefault();
        pendingToggle = true;
        flushPendingToggle();
      });

      connect();
    </script>
