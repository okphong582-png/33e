plugins { id 'com.android.application' }
android {
    namespace 'vn.mizze.androidviet'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.mizze.androidviet'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions += 'access'
    productFlavors {
        root {
            dimension 'access'
            applicationIdSuffix '.root'
            versionNameSuffix '-root'
            resValue 'string', 'app_name', 'Mizze'
            buildConfigField 'boolean', 'ROOT_EDITION', 'true'
        }
        noRoot {
            dimension 'access'
            applicationIdSuffix '.noroot'
            versionNameSuffix '-noroot'
            resValue 'string', 'app_name', 'Mizze'
            buildConfigField 'boolean', 'ROOT_EDITION', 'false'
        }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android { packaging { jniLibs { useLegacyPackaging true } } }
